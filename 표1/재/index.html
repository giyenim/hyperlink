                <p>잠재 웹사이트 작업실의 이름은 1960년에 프랑스에서 만들어진 문학 모임 울리포(OuLiPo)에서 따왔다. 울리포는 글쓰기에서 자유로운 창작 대신 규칙을 만들었다. 그리고 그 규칙
                    안에서 아직 발견되지 않은 문학적 가능성을 찾았다. 쓸 수 있는 것을 줄이고, 익숙한 방식을 피하고, 우연한 결과를 받아들이는 일이 작업의 조건이 되었다. 제약은 표현을 가로막는
                    장애물이 아니라 영감을 불러일으키는 수단이었다. 한계를 긋는 순간, 비로소 발견이 시작됐다.</p>
